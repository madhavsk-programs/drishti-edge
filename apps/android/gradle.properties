# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
org.gradle.caching=true
# Configuration cache disabled for now: the app hosts a foreground Service and
# manual DI container; re-enable once the module is stable.
org.gradle.configuration-cache=false

# No org.gradle.java.home here on purpose. It previously pinned a Linux path
# (/home/sparkle/.jdks/...) which fails on any other machine. The toolchain is
# resolved from JAVA_HOME, and the module's jvmToolchain(21) does the rest.

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
